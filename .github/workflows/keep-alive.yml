name: Keep Render Alive

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://whatsapp-bot-yhb4.onrender.com/health)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Bot is alive"
          else
            echo "❌ Bot returned $response"
          fi
